[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clat-tidy"
version = "0.6.0"
description = "Colin's LaTeX Tidy — somewhere between a clang and a splat"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
dependencies = ["rich", "tomli>=1.0; python_version < '3.11'"]
authors = [
    { name = "Colin Caprani" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://ccaprani.github.io/clat/"
Documentation = "https://ccaprani.github.io/clat/"
Repository = "https://github.com/ccaprani/clat"
Issues = "https://github.com/ccaprani/clat/issues"

[project.optional-dependencies]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[project.scripts]
clat = "clat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
